retract_speed = 40
retract_before_travel = 1.5
retract_lift = 0
wipe = 0
start_gcode = G90 ; absoluto\nM82 ; extrusor absoluto\nM140 S[first_layer_bed_temperature]\nM104 S150\nG28 ; home\nM190 S[first_layer_bed_temperature]\nM109 S[first_layer_temperature]\nG92 E0\nG1 Z2.0 F3000\nG1 X0.5 Y20 Z0.28 F5000\nG1 X0.5 Y180 Z0.28 F1500 E15 ; línea de purga\nG1 X0.9 Y180 Z0.28 F5000\nG1 X0.9 Y20 Z0.28 F1500 E30\nG92 E0\nG1 Z2.0 F3000
end_gcode = G91\nG1 E-2 F2700\nG1 Z10 F600\nG90\nG1 X0 Y190 F3000\nM106 S0\nM104 S0\nM140 S0\nM84 X Y E
before_layer_gcode = ;CAPA:[layer_num] Z:[layer_z]
layer_gcode =

