# PrusaSlicer — impresora Marlin genérica tipo Ender-3 Pro / Anet A8
# cama 200×200×200, boquilla 0,4, filamento 1,75, PLA, capa 0,2 (el diseño está alineado a capas de 0,2)
# Anet A8 (extrusor directo): cambiar retract_length = 2 y retract_speed = 35.

printer_technology = FFF
gcode_flavor = marlin2
bed_shape = 0x0,200x0,200x200,0x200
max_print_height = 200
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.32
use_relative_e_distances = 0
use_firmware_retraction = 0
machine_limits_usage = time_estimate_only
machine_max_acceleration_extruding = 500
machine_max_acceleration_retracting = 1000
machine_max_acceleration_travel = 500
machine_max_acceleration_x = 500
machine_max_acceleration_y = 500
machine_max_feedrate_x = 300
machine_max_feedrate_y = 300
machine_max_feedrate_z = 5
machine_max_feedrate_e = 25
machine_max_jerk_x = 8
machine_max_jerk_y = 8
