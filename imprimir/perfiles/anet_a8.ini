# Ajustes de la Anet A8 sobre ender3pro_pla_0.2.ini (cargar los dos, este el último):
#   prusa-slicer --load ender3pro_pla_0.2.ini --load anet_a8.ini ...
# Línea de purga separada del borde (el origen de la A8 varía según firmware).
# CONTRA LOS HILOS (con 2 mm a 35 mm/s y retracción en cada salto de 1 mm dejaba muchos):
#  - PLA a 200 °C (205 en la 1.ª capa): cada 5 °C menos gotea bastante menos.
#  - 4 mm a 40 mm/s con barrido: la MK8 de serie tiene el disipador forrado de PTFE y 2 mm no vacían la cámara.
#  - Retrae solo al salir de la pieza por encima de un perímetro y en viajes > 2 mm; los viajes van por dentro
#    de la pieza y a 150 mm/s; sin subir Z (el salto en Z estira hilos).
temperature = 200
first_layer_temperature = 205
retract_length = 4
retract_speed = 40
deretract_speed = 30
retract_restart_extra = 0
retract_lift = 0
wipe = 1
retract_before_wipe = 70%
retract_before_travel = 2
retract_layer_change = 0
only_retract_when_crossing_perimeters = 1
avoid_crossing_perimeters = 1
travel_speed = 150
seam_position = aligned
machine_max_acceleration_extruding = 800
machine_max_acceleration_travel = 800
machine_max_acceleration_x = 800
machine_max_acceleration_y = 800
machine_max_feedrate_z = 4
start_gcode = G90 ; absoluto\nM82 ; extrusor absoluto\nM140 S[first_layer_bed_temperature]\nM104 S150\nG28 ; home\nM190 S[first_layer_bed_temperature]\nM109 S[first_layer_temperature]\nG92 E0\nG1 Z2.0 F3000\nG1 X5 Y20 Z0.28 F5000\nG1 X5 Y180 Z0.28 F1500 E15 ; línea de purga\nG1 X5.4 Y180 Z0.28 F5000\nG1 X5.4 Y20 Z0.28 F1500 E30\nG92 E0\nG1 Z2.0 F3000
