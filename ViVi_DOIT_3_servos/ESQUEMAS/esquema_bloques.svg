<text x="52" y="58" class="head">ViVi: esquema de bloques funcional</text><text x="52" y="91" class="sub">Pines según el código abierto del robot ViVi. No es el esquema eléctrico del fabricante.</text><rect x="50" y="175" width="350" height="225" rx="12" fill="#eaf2fc" stroke="#416a9a" stroke-width="2"/><text x="68" y="212" class="lbl">ESP8266 · ESP-12F</text><text x="68" y="240" class="sub">Wi-Fi 2,4 GHz, UART 3,3 V</text><text x="75" y="291" class="small">GPIO4 : SDA</text><text x="75" y="330" class="small">GPIO5 : SCL</text><text x="75" y="369" class="small">GPIO13: habilitación /OE</text><rect x="565" y="175" width="335" height="225" rx="12" fill="#e9f9f7" stroke="#039596" stroke-width="2"/><text x="583" y="212" class="lbl">PCA9685 · I²C 0x40</text><text x="583" y="240" class="sub">16 salidas PWM de 12 bits</text><text x="587" y="290" class="small">Frecuencia objetivo: 50 Hz</text><text x="587" y="328" class="small">Canales PCA: 0...15</text><text x="587" y="366" class="small">Driver /OE activo bajo</text><rect x="940" y="205" width="210" height="160" rx="12" fill="#fff4e6" stroke="#cc8038" stroke-width="2"/><text x="958" y="242" class="lbl">Headers de servos</text><text x="958" y="270" class="sub">3 vías por servo</text><text x="958" y="306" class="small">SIG, V+, GND</text><text x="958" y="334" class="tiny">Comprobar el orden</text><path d="M400 269 H565" class="i2c"/><text x="440" y="251" class="small">SDA</text><path d="M400 310 H565" class="i2c"/><text x="440" y="302" class="small">SCL</text><path d="M400 350 H500 V385 H565" class="wire"/><text x="444" y="374" class="tiny">/OE</text><path d="M900 290 H940" class="sig"/><rect x="52" y="470" width="348" height="118" rx="12" fill="#fff" stroke="#416a9a" stroke-width="2"/><text x="70" y="507" class="lbl">UART DOWNLOAD</text><text x="70" y="535" class="sub">TXD / RXD / 3V3 / GND</text><path d="M226 470 V400" class="wire"/><text x="245" y="446" class="tiny">programación</text><rect x="560" y="470" width="340" height="118" rx="12" fill="#fff" stroke="#a38cca" stroke-width="2"/><text x="578" y="507" class="lbl">2 PWM auxiliares</text><text x="578" y="535" class="sub">GPIO12 y GPIO14, servo directo</text><path d="M400 390 H445 V530 H560" class="wire"/><path d="M900 530 H1090 V365" class="sig"/><rect x="50" y="635" width="1100" height="70" rx="12" fill="#fff0e9" stroke="#e4bb97"/><text x="70" y="666" class="small">Alimentación DC y V+ de servos: compruébalos en tu placa con el polímetro.</text><text x="70" y="690" class="small">No conectar 7,4 V / 9 V / 12 V ni asumir orientación de las 3 patillas.</text></svg>