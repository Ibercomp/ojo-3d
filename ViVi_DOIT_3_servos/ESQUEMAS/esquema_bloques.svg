<style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#1c334c}.head{font-size:29px;font-weight:700}.sub{font-size:16px;fill:#516879}.lbl{font-size:22px;font-weight:700}.small{font-size:16px}.tiny{font-size:13px}.wire{stroke:#53738b;stroke-width:3;fill:none}.i2c{stroke:#008f99;stroke-width:4;fill:none}.sig{stroke:#ce7b31;stroke-width:4;fill:none}.power{stroke:#c23d4b;stroke-width:4;fill:none}.gnd{stroke:#344b5d;stroke-width:4;fill:none}</style></defs>
