<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740"><defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0 0 9 4.5 0 9" fill="#53738b"/></marker>
<style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#1c334c}.head{font-size:29px;font-weight:700}.sub{font-size:16px;fill:#516879}.lbl{font-size:22px;font-weight:700}.small{font-size:16px}.tiny{font-size:13px}.wire{stroke:#53738b;stroke-width:3;fill:none}.i2c{stroke:#008f99;stroke-width:4;fill:none}.sig{stroke:#ce7b31;stroke-width:4;fill:none}.power{stroke:#c23d4b;stroke-width:4;fill:none}.gnd{stroke:#344b5d;stroke-width:4;fill:none}</style></defs>
<rect width="1200" height="740" fill="#f6f8fb"/>
<text x="52" y="58" class="head">Montaje de tres servos: conexionado práctico</text><text x="52" y="93" class="sub">El dibujo sólo muestra conexiones LÓGICAS; medir el pinout real y la tensión en V+.</text><rect x="65" y="185" width="260" height="165" rx="12" fill="#ffeff1" stroke="#bb4653" stroke-width="2"/><text x="83" y="222" class="lbl">Fuente regulada</text><text x="83" y="250" class="sub">5,0 V (*), &gt;=3 A (**)</text><text x="88" y="300" class="small">V+ (positivo)</text><text x="88" y="332" class="small">GND (masa)</text><rect x="430" y="155" width="365" height="310" rx="12" fill="#eaf5fb" stroke="#3f82af" stroke-width="2"/><text x="448" y="192" class="lbl">Placa DOIT ViVi</text><text x="448" y="220" class="sub">ESP8266 + PCA9685 + cabeceras</text><text x="453" y="266" class="small">Entrada: DC (+/- comprobado)</text><text x="453" y="307" class="small">PCA: PWM canal A</text><text x="453" y="345" class="small">PCA: PWM canal B</text><text x="453" y="383" class="small">PCA: PWM canal C</text><text x="453" y="431" class="tiny">GND y V+ de headers: verificar con polímetro</text><path class="power" d="M325 293 H375 V257 H430"/><path class="gnd" d="M325 324 H375 V288 H430"/><rect x="910" y="197" width="240" height="73" rx="8" fill="#fff8ed" stroke="#dba567" stroke-width="2"/><text x="925" y="228" class="lbl">Servo 1</text><text x="925" y="254" class="tiny">SIG + V+ + GND</text><path class="sig" d="M795 307 H840 V230 H910"/><rect x="910" y="287" width="240" height="73" rx="8" fill="#fff8ed" stroke="#dba567" stroke-width="2"/><text x="925" y="318" class="lbl">Servo 2</text><text x="925" y="344" class="tiny">SIG + V+ + GND</text><path class="sig" d="M795 345 H840 V320 H910"/><rect x="910" y="377" width="240" height="73" rx="8" fill="#fff8ed" stroke="#dba567" stroke-width="2"/><text x="925" y="408" class="lbl">Servo 3</text><text x="925" y="434" class="tiny">SIG + V+ + GND</text><path class="sig" d="M795 383 H840 V410 H910"/><text x="910" y="511" class="small">En cada servo:</text><text x="910" y="537" class="tiny">Alimentación y masa por el header</text><text x="910" y="559" class="tiny">al que pertenece la salida PWM.</text><rect x="65" y="505" width="375" height="85" rx="12" fill="#fff" stroke="#7384a5" stroke-width="2"/><text x="83" y="542" class="lbl">USB-UART 3,3 V</text><text x="83" y="570" class="sub">RX↔TXD · TX↔RXD · GND↔GND</text><path class="wire" d="M440 546 H490 V465"/><rect x="65" y="623" width="1085" height="89" rx="12" fill="#fff0e9" stroke="#e1a97d"/><text x="85" y="653" class="small">(*) 5 V solo si se comprueba que es apta para la entrada DC de esta revisión y tus servos.</text><text x="85" y="679" class="small">(**) Sumar corrientes stall de los 3 servos: 3 A es punto de partida, NO cálculo definitivo.</text></svg>