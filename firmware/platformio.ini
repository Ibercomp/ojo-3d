; Ojo animatrónico Ø150 — firmware ESP32 (Arduino)
;   pio run                 compilar
;   pio run -t upload       grabar (USB)
;   pio device monitor      consola serie a 115200 (comandos de calibración: escribir "ayuda")

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Servo@3.0.6
build_flags = -Wall
